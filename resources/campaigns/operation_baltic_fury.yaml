      size: 4
  # Rostock — Laage (20): coastal PVO, the Baltic approaches barrier.
  20:
    - primary: BARCAP
      secondary: any
      aircraft:
        - 790th Fighter Aviation Regiment
      aircraft_type: MiG-31 Foxhound
      size: 8
    - primary: BARCAP
      secondary: air-to-air
      aircraft:
        - 689th Guards Fighter Aviation Regiment
      aircraft_type: Su-27 Flanker-B
